<div class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Cambiar contrasena</h1>
      <p class="page-sub">
        Actualiza tu contrasena. Necesitaras tu contrasena actual y elegir una nueva. Por
        seguridad cerraremos tu sesion al terminar.
      </p>
    </div>
  </div>

  <div class="card">
    @if (errorMsg()) {
      <p class="err">{{ errorMsg() }}</p>
    }

    <label for="cp-current">Contrasena actual</label>
    <input
      id="cp-current"
      type="password"
      autocomplete="current-password"
      [ngModel]="currentPassword()"
      (ngModelChange)="currentPassword.set($event)"
    />

    <label for="cp-new">Nueva contrasena</label>
    <input
      id="cp-new"
      type="password"
      minlength="6"
      maxlength="40"
      autocomplete="new-password"
      [ngModel]="newPassword()"
      (ngModelChange)="newPassword.set($event)"
    />

    <label for="cp-confirm">Confirmar nueva contrasena</label>
    <input
      id="cp-confirm"
      type="password"
      autocomplete="new-password"
      [ngModel]="confirmPassword()"
      (ngModelChange)="confirmPassword.set($event)"
    />

    <div class="actions-row">
      <button type="button" class="btn primary" (click)="submit()" [disabled]="loading()">
        Cambiar contrasena
      </button>
    </div>
  </div>
</div>

<!-- Success notice -->
@if (notice(); as n) {
  <div class="modal-backdrop" role="presentation">
    <div
      class="modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="notice-title"
      aria-describedby="notice-msg"
    >
      <div class="modal__header">
        <div
          class="modal__icon"
          [class.modal__icon--success]="n.kind === 'success'"
          [class.modal__icon--error]="n.kind === 'error'"
          aria-hidden="true"
        >
          @if (n.kind === 'success') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          }
        </div>
        <h2 id="notice-title" class="modal__title">{{ n.title }}</h2>
      </div>
      <p id="notice-msg" class="modal__message">{{ n.message }}</p>
      <div class="modal__actions">
        <button type="button" class="btn primary" (click)="acceptNoticeAndLogout()">
          Cerrar sesion
        </button>
      </div>
    </div>
  </div>
}

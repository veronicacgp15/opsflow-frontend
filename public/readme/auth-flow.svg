<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg2)"/>
  <text x="640" y="78" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    Frontend Authentication Flow
  </text>
  <text x="640" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    Login, token storage, interceptor and refresh cycle
  </text>

  <g filter="url(#shadow2)">
    <rect x="70" y="230" width="210" height="250" rx="22" fill="url(#step)" stroke="#334155"/>
    <circle cx="175" cy="274" r="28" fill="url(#accent2)" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="175" y="283" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="175" y="338" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Login Page</text>
    <text x="175" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">User enters</text>
    <text x="175" y="396" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">username and password</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="315" y="230" width="210" height="250" rx="22" fill="url(#step)" stroke="#334155"/>
    <circle cx="420" cy="274" r="28" fill="url(#accent2)" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="420" y="283" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="420" y="338" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">POST /auth/login</text>
    <text x="420" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Request goes through</text>
    <text x="420" y="396" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">/api to the Gateway</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="560" y="230" width="210" height="250" rx="22" fill="url(#step)" stroke="#334155"/>
    <circle cx="665" cy="274" r="28" fill="url(#accent2)" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="665" y="283" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="665" y="338" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Store Tokens</text>
    <text x="665" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">JWT, refresh token</text>
    <text x="665" y="396" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">and user data in localStorage</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="805" y="230" width="210" height="250" rx="22" fill="url(#step)" stroke="#334155"/>
    <circle cx="910" cy="274" r="28" fill="url(#accent2)" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="910" y="283" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text>
    <text x="910" y="338" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Auth Interceptor</text>
    <text x="910" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Adds</text>
    <text x="910" y="396" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Authorization: Bearer token</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1050" y="230" width="160" height="250" rx="22" fill="url(#step)" stroke="#334155"/>
    <circle cx="1130" cy="274" r="28" fill="url(#accent2)" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="1130" y="283" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">5</text>
    <text x="1130" y="338" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">401?</text>
    <text x="1130" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Try refresh</text>
    <text x="1130" y="396" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">or redirect to login</text>
  </g>

  <path d="M280 355H315" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M292 339L318 355L292 371" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M525 355H560" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M537 339L563 355L537 371" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M770 355H805" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M782 339L808 355L782 371" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1015 355H1050" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M1027 339L1053 355L1027 371" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1130 480C1130 580 760 620 760 545" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 12"/>
  <path d="M748 558L760 532L772 558" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="948" y="626" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    On token expiration, the interceptor calls /auth/refresh before forcing logout
  </text>
</svg>

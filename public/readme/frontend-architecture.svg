<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="640" y="78" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    OpsFlow Frontend Architecture
  </text>
  <text x="640" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    Angular 19 + API Gateway + Microservices
  </text>

  <rect x="80" y="180" width="280" height="280" rx="24" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <rect x="132" y="220" width="176" height="112" rx="18" fill="#0B1220" stroke="#475569"/>
  <rect x="154" y="244" width="132" height="12" rx="6" fill="#38BDF8" fill-opacity="0.9"/>
  <rect x="154" y="270" width="98" height="12" rx="6" fill="#22D3EE" fill-opacity="0.7"/>
  <rect x="154" y="296" width="118" height="12" rx="6" fill="#60A5FA" fill-opacity="0.75"/>
  <text x="220" y="382" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    Frontend
  </text>
  <text x="220" y="414" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    Angular 19
  </text>
  <text x="220" y="440" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Router + Guards + Interceptor
  </text>

  <rect x="500" y="210" width="280" height="220" rx="24" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <circle cx="640" cy="268" r="34" fill="url(#accent)" fill-opacity="0.18" stroke="#38BDF8"/>
  <path d="M628 268H652" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M640 256V280" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <text x="640" y="340" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    Gateway Service
  </text>
  <text x="640" y="372" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    http://localhost:8080
  </text>
  <text x="640" y="400" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Single entry point for /auth, /users, /org, /documents
  </text>

  <rect x="920" y="146" width="250" height="120" rx="22" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="1045" y="198" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    Auth Service
  </text>
  <text x="1045" y="230" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Login, JWT, roles and users
  </text>

  <rect x="920" y="300" width="250" height="120" rx="22" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="1045" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    Org Service
  </text>
  <text x="1045" y="384" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Organizations and locations
  </text>

  <rect x="920" y="454" width="250" height="120" rx="22" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="1045" y="506" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    Document Service
  </text>
  <text x="1045" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Documents, versions and downloads
  </text>

  <rect x="534" y="92" width="212" height="74" rx="20" fill="#082F49" stroke="#0EA5E9"/>
  <text x="640" y="124" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    Eureka Server
  </text>
  <text x="640" y="148" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">
    Service discovery
  </text>

  <path d="M360 320H500" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M478 304L504 320L478 336" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M780 320H920" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M898 304L924 320L898 336" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M780 320C840 320 850 206 920 206" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <path d="M780 320C840 320 850 514 920 514" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>

  <path d="M640 166V208" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>
  <text x="640" y="654" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    Development requests use /api in Angular and are proxied to the Gateway on localhost:8080
  </text>
</svg>
